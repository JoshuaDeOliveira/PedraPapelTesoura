<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedra Papel Tesoura</title>

  <link rel="stylesheet" href="./Estilos/Global.css"> <!--CSS GLOBAL-->
  <link rel="stylesheet" href="./Estilos/Style.css"> <!--CSS Da Pagina-->
</head>
<body>
  <h1>Pedra Papel Tesoura</h1>
  <div class="Botoes">
    <button class="Game Papel">✋</button>
    <button class="Game Pedra">🤜</button>
    <button class="Game Tesoura">✌</button>
  </div>

  <p id="Resultado" class="Respostas"></p>
  <p id="Explicacao" class="Respostas"></p>

  <div class="Res">
    <ul class="Score">
      <li class="List">Wins: </li>
      <li class="List">Losses: </li>
      <li class="List">Draw: </li>     
    </ul>

    <ul class="Score">
      <li class="List" id="Vitoria">0</li>
      <li class="List" id="Derrota">0</li>
      <li class="List" id="Empate">0</li>
    </ul>
  </div>

  <button id="Reset" class="Reset">Reset Score</button>
  <button id="Delete" class="AutoPlay">Auto Player</button>

  <div class="js-certeza">
    <p id="Resetar">Você tem certeza que quer resetar?</p>
    <button class="Certeza Sim">Sim</button>
    <button class="Certeza Nao">Não</button>
  </div>

  <script src="./Script/Script.js"></script>
</body>
</html>
