<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedra Papel Tesoura</title>

  <link rel="stylesheet" href="./Estilos/style.css"> <!--CSS Da Pagina-->

  <link rel="stylesheet" href="./Estilos/Global.css"> <!--CSS GLOBAL-->
</head>
<body>
  <h1>Pedra Papel Tesoura</h1>
  <div class="Botoes">
    <button onclick="Jokenpo('✋')" class="Game">✋</button>
    <button onclick="Jokenpo('🤜')" class="Game">🤜</button>
    <button onclick="Jokenpo('✌')" class="Game">✌</button>
  </div>

  <p id="Resultado" class="Respostas"></p>
  <p id="Explicacao" class="Respostas"></p>

  <div class="Res">
    <ul class="Score">
      <li class="List">Wins: </li>
      <li class="List">Losses: </li>
      <li class="List">Draw: </li>     
    </ul>

    <ul class="Score">
      <li class="List" id="Vitoria">0</li>
      <li class="List" id="Derrota">0</li>
      <li class="List" id="Empate">0</li>
    </ul>
  </div>

  <button id="Reset" onclick="Reset()">Reset Score</button>

  <script src="./Script/Script.js"></script>
</body>
</html>
